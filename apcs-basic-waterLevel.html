<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APCS o711 水位上升視覺化模擬器</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .main-container { display: flex; gap: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .controls { width: 300px; }
        .canvas-container { display: flex; flex-direction: column; align-items: center; background: #fafafa; border-radius: 8px; padding: 10px; border: 1px solid #ddd; }
        canvas { background-color: #fff; border-bottom: 4px solid #333; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 14px; margin-bottom: 3px; color: #555; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #27ae60; }
        #log { margin-top: 15px; font-size: 14px; max-height: 200px; overflow-y: auto; }
        .highlight { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<h1>o711 裝飲料：水位變化視覺化</h1>

<div class="main-container">
    <!-- 控制面板 -->
    <div class="controls">
        <div class="input-group">
            <label>裝水次數 (n):</label>
            <input type="number" id="n_val" value="3">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
            <div class="input-group"><label>下層寬 (w1):</label><input type="number" id="w1" value="10"></div>
            <div class="input-group"><label>下層高 (h1):</label><input type="number" id="h1" value="10"></div>
            <div class="input-group"><label>上層寬 (w2):</label><input type="number" id="w2" value="6"></div>
            <div class="input-group"><label>上層高 (h2):</label><input type="number" id="h2" value="10"></div>
        </div>
        <div class="input-group">
            <label>倒入容量 (空格隔開):</label>
            <input type="text" id="v_list" value="500 600 200">
        </div>
        <button onclick="startSimulation()">開始模擬裝水</button>
        <div id="log"></div>
    </div>

    <!-- 圖像顯示區 -->
    <div class="canvas-container">
        <canvas id="cupCanvas" width="300" height="400"></canvas>
        <p id="max-result" style="font-weight: bold; margin-top: 10px;"></p>
    </div>
</div>

<script>
    const canvas = document.getElementById('cupCanvas');
    const ctx = canvas.getContext('2d');
    const SCALE = 15; // 縮放比例，將 cm 轉換為像素

    function drawCup(w1, h1, w2, h2, currentH) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const centerX = canvas.width / 2;
        const bottomY = canvas.height - 20;

        // 計算杯子輪廓座標
        const b_w = w1 * SCALE;
        const b_h = h1 * SCALE;
        const t_w = w2 * SCALE;
        const t_h = h2 * SCALE;

        // 1. 繪製杯子外框
        ctx.beginPath();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        // 下層
        ctx.strokeRect(centerX - b_w/2, bottomY - b_h, b_w, b_h);
        // 上層
        ctx.strokeRect(centerX - t_w/2, bottomY - b_h - t_h, t_w, t_h);

        // 2. 繪製藍色水面
        if (currentH > 0) {
            ctx.fillStyle = 'rgba(52, 152, 219, 0.7)';
            if (currentH <= h1) {
                // 水還在下層
                const fillH = currentH * SCALE;
                ctx.fillRect(centerX - b_w/2 + 1, bottomY - fillH, b_w - 2, fillH);
            } else {
                // 水漫到上層
                // 先填滿下層
                ctx.fillRect(centerX - b_w/2 + 1, bottomY - b_h, b_w - 2, b_h);
                // 再填上層部分
                const fillH_top = (currentH - h1) * SCALE;
                ctx.fillRect(centerX - t_w/2 + 1, bottomY - b_h - fillH_top, t_w - 2, fillH_top);
            }
        }
        
        // 標記刻度文字
        ctx.fillStyle = "#000";
        ctx.fillText(`當前水位: ${currentH.toFixed(1)} cm`, 10, 20);
    }

    async function startSimulation() {
        const n = parseInt(document.getElementById('n_val').value);
        const w1 = parseInt(document.getElementById('w1').value);
        const h1 = parseInt(document.getElementById('h1').value);
        const w2 = parseInt(document.getElementById('w2').value);
        const h2 = parseInt(document.getElementById('h2').value);
        const volumes = document.getElementById('v_list').value.trim().split(/\s+/).map(Number);
        const logDiv = document.getElementById('log');
        const resP = document.getElementById('max-result');

        logDiv.innerHTML = "<b>模擬進度：</b><br>";
        let currentH = 0;
        let currentV = 0;
        let maxIncrease = 0;
        const area1 = w1 * w1;
        const area2 = w2 * w2;
        const vol1 = area1 * h1;
        const vol2 = area2 * h2;
        const maxVol = vol1 + vol2;

        for (let i = 0; i < n; i++) {
            if (isNaN(volumes[i])) break;
            
            let oldH = currentH;
            currentV = Math.min(maxVol, currentV + volumes[i]);

            // 計算新高度
            if (currentV <= vol1) {
                currentH = currentV / area1;
            } else {
                currentH = h1 + (currentV - vol1) / area2;
            }

            let increase = currentH - oldH;
            if (increase > maxIncrease) maxIncrease = increase;

            // 更新畫面
            drawCup(w1, h1, w2, h2, currentH);
            logDiv.innerHTML += `第 ${i+1} 次：上升 ${increase.toFixed(1)} cm (總高 ${currentH.toFixed(1)})<br>`;
            
            // 停頓一下產生動畫感
            await new Promise(r => setTimeout(r, 800));
        }

        resP.innerHTML = `最高水位上升量：<span class="highlight">${maxIncrease}</span> cm`;
    }

    // 初始繪製空杯子
    window.onload = () => drawCup(10, 10, 6, 10, 0);
</script>

</body>
</html>
